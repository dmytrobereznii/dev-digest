# mcp suite — the local stdio MCP server (@devdigest/mcp). A thin HTTP client
# of the running API; tests stub fetch, so this lane needs no Docker and no
# live API. Uses npm (package-lock.json).
#
# server/src/vendor/shared/** is in the path filter because mcp aliases
# @devdigest/shared to it at type-check time (D3). .mcp.json is in the filter
# because check-mcp-json.mjs (D16) guards it.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.mcp.json'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.mcp.json'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: check .mcp.json (D16)
        working-directory: .
        run: node mcp/scripts/check-mcp-json.mjs

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
